            <div class="helper" style="margin-bottom:8px;">該当する人がいない場合は新しく追加：</div>
            <div class="chip-add-input">
                <input data-field="newJoinName" placeholder="あなたの名前" maxlength="20">
                <button data-action="join-as-new">追加して参加</button>
            </div>
            <button class="btn-secondary" style="margin-top:14px;" data-action="cancel-join">キャンセル</button>
        `;
    }

    function sheetJoinManual() {
        return `
            <div class="sheet-title">同期IDで参加</div>
            <div class="helper" style="margin-bottom:14px;">彼女が共有してくれた同期ID（8文字）を入力してね。</div>
            <input data-field="joinCode" placeholder="例: A1B2C3D4" maxlength="8" style="text-transform:uppercase; letter-spacing:2px; font-family:monospace; font-size:18px; text-align:center;">
            <button class="btn-primary" style="margin-top:14px;" data-action="confirm-join">参加する</button>
        `;
    }

    function sheetHelp() {
        return `
            <div class="sheet-title">使い方</div>
            <div style="line-height:1.7; font-size:14px; color:var(--text-secondary);">
                <p style="color:var(--text); font-weight:600;">📒 トリカウント</p>
                <p style="margin-bottom:12px;">旅行・同棲・ルームシェアなど、グループごとに支払いを記録するノートだよ。</p>

                <p style="color:var(--text); font-weight:600;">💸 支出 / 収入 / 送金</p>
                <p style="margin-bottom:12px;">「支出」は誰かが立て替えた金額。均等にも個別指定にも分けられる。「収入」は逆。「送金」は人から人へのお金の受け渡し（精算）。</p>

                <p style="color:var(--text); font-weight:600;">🔗 自動同期</p>
                <p style="margin-bottom:12px;">右上のシェアからリンクを送ると、別の端末でもまったく同じデータをリアルタイムで共有できる。Firebase経由で常時バックアップされ、端末側のローカルキャッシュにも自動保存されるからデータは消えない。</p>

                <p style="color:var(--text); font-weight:600;">⚖️ 残高</p>
                <p>各メンバーの残高（プラス=もらえる、マイナス=払う）と、最少回数の精算プランを自動計算するよ。</p>
            </div>
            <button class="btn-primary" style="margin-top:18px;" data-action="close-sheet">OK</button>
        `;
    }

    function shareUrl(roomId) {
        const url = new URL(window.location.href);
        url.search = '?room=' + roomId;
        return url.toString();
    }

    // ------------------------------------------------------------------
    // Event binding
    // ------------------------------------------------------------------
    function bindEvents() {
        // Generic data-action click delegation
        app.querySelectorAll('[data-action]').forEach(el => {
            el.addEventListener('click', (ev) => {
                const action = el.dataset.action;
                handleAction(action, el, ev);
            });
        });
        // Sheet click outside-to-close
        const backdrop = app.querySelector('.sheet-backdrop');
        if (backdrop) {
            const sheet = backdrop.querySelector('.sheet');
            sheet && sheet.addEventListener('click', e => e.stopPropagation());
        }
        // Live form bindings
        bindFormFields();
    }

    function bindFormFields() {
        // New tricount sheet
        if (state.sheet === 'newTricount') {
            const draft = state.sheetData;
            const setBy = (sel, key) => {
                const el = app.querySelector(sel);
                if (el) el.addEventListener('input', () => { draft[key] = el.value; });
            };
            setBy('[data-field="name"]', 'name');
            setBy('[data-field="description"]', 'description');
            const cur = app.querySelector('[data-field="currency"]');
            if (cur) cur.addEventListener('change', () => { draft.currency = cur.value; });
            const myId = app.querySelector('[data-field="myId"]');
            if (myId) myId.addEventListener('change', () => { draft.myId = myId.value; });
            // Rename inline
            app.querySelectorAll('[data-rename]').forEach(input => {
                input.addEventListener('input', () => {
                    const id = input.dataset.rename;
                    const p = draft.participants.find(p => p.id === id);
                    if (p) p.name = input.value;
                });
            });
        }

        if (state.sheet === 'addExpense' || state.sheet === 'editExpense') {
            const draft = state.sheetData;
            const data = state.currentData;
            const titleEl = app.querySelector('[data-field="title"]');
            if (titleEl) titleEl.addEventListener('input', () => { draft.title = titleEl.value; });
            const amountEl = app.querySelector('[data-field="amount"]');
            if (amountEl) amountEl.addEventListener('input', () => {
                draft.amount = parseFloat(amountEl.value) || 0;
                if (draft.splitMode === 'equal') {
                    const included = draft.splits.filter(s => s.included);
                    const eq = distributeEqually(draft.amount, included.length, data.currency);
                    included.forEach((s, i) => { s.amount = eq[i] || 0; });
                    // Update visible amounts only
                    app.querySelectorAll('.split-amount').forEach((el, idx) => {
                        const matchSplit = draft.splits.filter(s => s.included)[idx];
                        if (matchSplit) el.textContent = formatMoney(matchSplit.amount, data.currency);
                    });
                }
            });
            const paidByEl = app.querySelector('[data-field="paidBy"]');
            if (paidByEl) paidByEl.addEventListener('change', () => { draft.paidBy = paidByEl.value; });
            const dateEl = app.querySelector('[data-field="date"]');
            if (dateEl) dateEl.addEventListener('change', () => { draft.date = dateEl.value; });
            // Custom split amounts
            app.querySelectorAll('[data-split-amount]').forEach(el => {
                el.addEventListener('input', () => {
                    const id = el.dataset.splitAmount;
                    const s = draft.splits.find(x => x.participantId === id);
                    if (s) s.amount = parseFloat(el.value) || 0;
                });
            });
            // Transfer recipient
            const trEl = app.querySelector('[data-field="transferTo"]');
            if (trEl) trEl.addEventListener('change', () => {
                draft.splits.forEach(s => { s.included = false; s.amount = 0; });
                let rec = draft.splits.find(s => s.participantId === trEl.value);
                if (!rec) {
                    rec = { participantId: trEl.value, amount: draft.amount, included: true };
                    draft.splits.push(rec);
                } else {
                    rec.included = true;
                    rec.amount = draft.amount;
                }
            });
        }

        if (state.sheet === 'settings') {
            const draft = state.sheetData;
            const data = state.currentData;
            const map = {
                settingsName: 'name',
                settingsDesc: 'description',
            };
            Object.keys(map).forEach(f => {
                const el = app.querySelector(`[data-field="${f}"]`);
                if (el) el.addEventListener('input', () => { draft[map[f]] = el.value; });
            });
            const cur = app.querySelector('[data-field="settingsCurrency"]');
            if (cur) cur.addEventListener('change', () => { draft.currency = cur.value; });
            const my = app.querySelector('[data-field="settingsMyId"]');
            if (my) my.addEventListener('change', () => { draft.myId = my.value; });
            // Rename existing participants live
            app.querySelectorAll('[data-rename-existing]').forEach(input => {
                input.addEventListener('change', () => {
                    const id = input.dataset.renameExisting;
                    renameParticipant(id, input.value);
                });
            });
        }

        if (state.sheet === 'addSettle') {
            const draft = state.sheetData;
            const fromEl = app.querySelector('[data-field="settleFrom"]');
            if (fromEl) fromEl.addEventListener('change', () => { draft.from = fromEl.value; });
            const toEl = app.querySelector('[data-field="settleTo"]');
            if (toEl) toEl.addEventListener('change', () => { draft.to = toEl.value; });
            const amtEl = app.querySelector('[data-field="settleAmount"]');
            if (amtEl) amtEl.addEventListener('input', () => { draft.amount = parseFloat(amtEl.value) || 0; });
            const dateEl = app.querySelector('[data-field="settleDate"]');
            if (dateEl) dateEl.addEventListener('change', () => { draft.date = dateEl.value; });
        }
    }

    function handleAction(action, el, ev) {
        switch (action) {
            case 'open-tricount': {
                openTricount(el.dataset.room);
                break;
            }
            case 'back-home': {
                exitTricount();
                break;
            }
            case 'new-tricount': {
                state.sheet = 'newTricount';
                state.sheetData = null;
                render();
                break;
            }
            case 'pick-emoji': {
                if (state.sheetData) state.sheetData.emoji = el.dataset.emoji;
                render();
                break;
            }
            case 'add-draft-p': {
                ev.stopPropagation();
                const input = app.querySelector('[data-field="newP"]');
                const name = (input.value || '').trim();
                if (!name) return;
                state.sheetData.participants.push({ id: uid('p_'), name });
                input.value = '';
                render();
                break;
            }
            case 'remove-draft-p': {
                ev.stopPropagation();
                const id = el.dataset.id;
                state.sheetData.participants = state.sheetData.participants.filter(p => p.id !== id);
                if (state.sheetData.myId === id) state.sheetData.myId = state.sheetData.participants[0] && state.sheetData.participants[0].id;
                render();
                break;
            }
            case 'confirm-new-tricount': {
                const draft = state.sheetData;
                if (!draft.name.trim()) return showToast('名前を入れてね');
                if (draft.participants.length < 1) return showToast('参加者が必要だよ');
                if (!draft.myId) draft.myId = draft.participants[0].id;
                createTricount({
                    name: draft.name.trim(),
                    emoji: draft.emoji,
                    description: draft.description.trim(),
                    currency: draft.currency,
                    participants: draft.participants.map(p => ({ id: p.id, name: p.name.trim() || '?' })),
                    myId: draft.myId,
                });
                state.sheet = null;
                state.sheetData = null;
                render();
                break;
            }
            case 'close-sheet': {
                state.sheet = null;
                state.sheetData = null;
                render();
                break;
            }
            case 'add-expense': {
                state.sheet = 'addExpense';
                state.sheetData = null;
                render();
                break;
            }
            case 'open-expense': {
                state.sheet = 'editExpense';
                state.sheetData = { id: el.dataset.id };
                render();
                break;
            }
            case 'open-settle': {
                state.sheet = 'editSettle';
                state.sheetData = { id: el.dataset.id };
                render();
                break;
            }
            case 'set-type': {
                const draft = state.sheetData;
                draft.type = el.dataset.type;
                if (draft.type === 'transfer') {
                    // Pick first non-payer as recipient
                    const data = state.currentData;
                    const recipient = data.participants.find(p => p.id !== draft.paidBy) || data.participants[0];
                    draft.splits = draft.splits.map(s => ({ ...s, included: false, amount: 0 }));
                    let rec = draft.splits.find(s => s.participantId === recipient.id);
                    if (!rec) {
                        rec = { participantId: recipient.id, amount: draft.amount, included: true };
                        draft.splits.push(rec);
                    } else {
                        rec.included = true;
                        rec.amount = draft.amount;
                    }
                    draft.splitMode = 'custom';
                } else {
                    draft.splitMode = 'equal';
                    state.currentData.participants.forEach(p => {
                        if (!draft.splits.find(s => s.participantId === p.id)) {
                            draft.splits.push({ participantId: p.id, amount: 0, included: true });
                        } else {
                            const s = draft.splits.find(s => s.participantId === p.id);
                            s.included = true;
                        }
                    });
                }
                render();
                break;
            }
            case 'toggle-split': {
                const id = el.dataset.id;
                const s = state.sheetData.splits.find(x => x.participantId === id);
                if (s) s.included = !s.included;
                render();
                break;
            }
            case 'toggle-split-mode': {
                state.sheetData.splitMode = state.sheetData.splitMode === 'equal' ? 'custom' : 'equal';
                render();
                break;
            }
            case 'confirm-expense': {
                const draft = state.sheetData;
                const data = state.currentData;
                if (!draft.title.trim()) return showToast('タイトルを入れてね');
                if (!draft.amount || draft.amount <= 0) return showToast('金額を入れてね');
                if (!draft.paidBy) return showToast('払った人を選んでね');
                let splits;
                if (draft.type === 'transfer') {
                    const rec = draft.splits.find(s => s.included);
                    if (!rec || rec.participantId === draft.paidBy) return showToast('受取人を選んでね');
                    splits = [{ participantId: rec.participantId, amount: draft.amount }];
                } else {
                    const included = draft.splits.filter(s => s.included);
                    if (included.length === 0) return showToast('割り勘する人を1人以上選んでね');
                    if (draft.splitMode === 'equal') {
                        const eq = distributeEqually(draft.amount, included.length, data.currency);
                        splits = included.map((s, i) => ({ participantId: s.participantId, amount: eq[i] }));
                    } else {
                        const sum = included.reduce((acc, s) => acc + Number(s.amount || 0), 0);
                        if (Math.abs(sum - draft.amount) > 0.01) return showToast('割り勘の合計が金額と一致しないよ');
                        splits = included.map(s => ({ participantId: s.participantId, amount: Number(s.amount) || 0 }));
                    }
                }
                const expense = {
                    id: draft.id || uid('e_'),
                    type: draft.type,
                    title: draft.title.trim(),
                    amount: roundForCurrency(draft.amount, data.currency),
                    paidBy: draft.paidBy,
                    date: draft.date,
                    splits,
                    createdAt: draft.createdAt || Date.now(),
                };
                if (draft.id) updateExpense(expense); else addExpense(expense);
                state.sheet = null;
                state.sheetData = null;
                render();
                break;
            }
            case 'delete-expense': {
                if (!confirm('この支払いを削除しますか？')) return;
                deleteExpense(el.dataset.id);
                state.sheet = null;
                state.sheetData = null;
                render();
                break;
            }
            case 'open-share': {
                state.sheet = 'share';
                render();
                break;
            }
            case 'copy-link': {
                const link = el.dataset.link;
                copyToClipboard(link);
                break;
            }
            case 'share-system': {
                const link = el.dataset.link;
                if (navigator.share) {
                    navigator.share({ title: 'warikan', url: link }).catch(() => {});
                } else {
                    copyToClipboard(link);
                }
                break;
            }
            case 'open-settings': {
                state.sheet = 'settings';
                state.sheetData = null;
                render();
                break;
            }
            case 'settings-emoji': {
                state.sheetData.emoji = el.dataset.emoji;
                render();
                break;
            }
            case 'settings-add-p': {
                ev.stopPropagation();
                const input = app.querySelector('[data-field="settingsAddP"]');
                const name = (input.value || '').trim();
                if (!name) return;
                addParticipant(name);
                render();
                break;
            }
            case 'remove-existing-p': {
                ev.stopPropagation();
                if (!confirm('この参加者を削除しますか？')) return;
                removeParticipant(el.dataset.id);
                render();
                break;
            }
            case 'confirm-settings': {
                const draft = state.sheetData;
                const data = state.currentData;
                if (!draft.name.trim()) return showToast('名前を入れてね');
                data.name = draft.name.trim();
                data.emoji = draft.emoji;
                data.description = (draft.description || '').trim();
                data.currency = draft.currency;
                pushCurrentRoom();
                // Update myId on local meta
                const meta = state.tricounts.find(t => t.roomId === state.currentRoomId);
                if (meta && draft.myId) { meta.myId = draft.myId; saveTricounts(); }
                state.sheet = null;
                state.sheetData = null;
                render();
                break;
            }
            case 'delete-tricount': {
                if (!confirm('このトリカウントをこの端末から削除しますか？\n他の端末には残ります。')) return;
                const rid = state.currentRoomId;
                state.sheet = null;
                state.sheetData = null;
                deleteTricount(rid);
                render();
                break;
            }
            case 'pick-join': {
                completeJoin(el.dataset.id);
                break;
            }
            case 'join-as-new': {
                const input = app.querySelector('[data-field="newJoinName"]');
                const name = (input.value || '').trim();
                if (!name) return showToast('名前を入れてね');
                joinAsNewParticipant(name);
                break;
            }
            case 'cancel-join': {
                state.pendingJoinRoom = null;
                state.sheet = null;
                // Clean URL
                const url = new URL(window.location);
                url.searchParams.delete('room');
                window.history.replaceState({}, '', url);
                render();
                break;
            }
            case 'show-join': {
                state.sheet = 'join';
                state.sheetData = null;
                render();
                break;
            }
            case 'confirm-join': {
                const input = app.querySelector('[data-field="joinCode"]');
                const code = (input.value || '').trim().toUpperCase();
                if (!code) return showToast('IDを入れてね');
                state.sheet = null;
                state.sheetData = null;
                // Trigger join flow
                const url = new URL(window.location);
                url.searchParams.set('room', code);
                window.history.replaceState({}, '', url);
                tryJoinFromUrl();
                break;
            }
            case 'show-help': {
                state.sheet = 'help';
                render();
                break;
            }
            case 'quick-settle': {
                state.sheet = 'addSettle';
                state.sheetData = null;
                render();
                break;
            }
            case 'confirm-settle': {
                const draft = state.sheetData;
                const data = state.currentData;
                if (!draft.amount || draft.amount <= 0) return showToast('金額を入れてね');
                if (draft.from === draft.to) return showToast('別の人を選んでね');
                addSettlement({
                    id: uid('s_'),
                    from: draft.from,
                    to: draft.to,
                    amount: roundForCurrency(draft.amount, data.currency),
                    date: draft.date || todayISO(),
                });
                state.sheet = null;
                state.sheetData = null;
                render();
                break;
            }
            case 'delete-settle': {
                if (!confirm('この精算を取り消しますか？')) return;
                deleteSettlement(el.dataset.id);
                state.sheet = null;
                state.sheetData = null;
                render();
                break;
            }
        }
    }

    function copyToClipboard(text) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(
                () => showToast('リンクをコピーしたよ💕'),
                () => fallbackCopy(text)
            );
        } else {
            fallbackCopy(text);
        }
    }
    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('リンクをコピーしたよ💕'); }
        catch { prompt('リンク', text); }
        document.body.removeChild(ta);
    }

    // ------------------------------------------------------------------
    // Boot
    // ------------------------------------------------------------------
    function boot() {
        state.tricounts = loadTricounts();
        migrateLegacy();
        render();
        tryJoinFromUrl();

        // Online/offline detection
        window.addEventListener('online', () => {
            if (state.currentRoomId && state.currentData) {
                state.syncStatus = 'syncing';
                pushCurrentRoom();
            }
        });
        window.addEventListener('offline', () => {
            state.syncStatus = 'offline';
            render();
        });
    }

    boot();
    </script>
