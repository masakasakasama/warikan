<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>warikan</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #000000;
            --bg-elev: #1c1c1e;
            --bg-elev-2: #2c2c2e;
            --bg-input: #1c1c1e;
            --border: #38383a;
            --text: #ffffff;
            --text-secondary: #8e8e93;
            --text-tertiary: #636366;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-soft: rgba(37, 99, 235, 0.15);
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        button, input, select, textarea {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            background: none;
            border: none;
        }

        input, select, textarea {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            padding: 14px 16px;
            outline: none;
            width: 100%;
            transition: border-color 0.15s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #app {
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        /* Top bar */
        .topbar {
            display: flex;
            align-items: center;
            padding: calc(var(--safe-top) + 12px) 16px 12px;
            min-height: calc(var(--safe-top) + 56px);
            gap: 12px;
            flex-shrink: 0;
        }

        .topbar-back {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: -8px;
            color: var(--text);
            font-size: 24px;
        }

        .topbar-title {
            flex: 1;
            font-size: 20px;
            font-weight: 600;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar-action {
            color: var(--primary);
            font-weight: 600;
            font-size: 16px;
            padding: 8px 4px;
        }

        .topbar-action.icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 22px;
        }

        /* Brand header for home */
        .brand {
            padding: calc(var(--safe-top) + 16px) 20px 16px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-shrink: 0;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .brand-sub {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 16px calc(var(--safe-bottom) + 100px);
        }

        /* Tricount list card */
        .tricount-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-elev);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .tricount-card:active {
            background: var(--bg-elev-2);
        }

        .tricount-emoji {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: var(--bg-elev-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }

        .tricount-info {
            flex: 1;
            min-width: 0;
        }

        .tricount-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tricount-desc {
            font-size: 13px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tricount-arrow {
            color: var(--text-tertiary);
            font-size: 20px;
            margin-left: 4px;
        }

        /* Floating add */
        .fab-wrap {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(var(--safe-bottom) + 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }

        .fab {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
            pointer-events: auto;
        }

        .fab:active { background: var(--primary-hover); }

        .fab-label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        /* Bottom navigation */
        .bottom-nav {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 calc(var(--safe-bottom) + 8px);
            background: var(--bg);
            border-top: 1px solid var(--border);
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            padding: 4px 12px;
            min-width: 64px;
        }

        .bottom-nav-item.active { color: var(--primary); }
        .bottom-nav-icon { font-size: 22px; line-height: 1; }
        .bottom-nav-label { font-size: 11px; font-weight: 500; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            background: var(--bg-elev);
            border-radius: 999px;
            padding: 4px;
            margin: 0 0 20px;
        }

        .tab {
            flex: 1;
            padding: 10px 8px;
            text-align: center;
            border-radius: 999px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            transition: all 0.15s;
        }

        .tab.active {
            background: var(--primary);
            color: #fff;
        }

        /* Form */
        .form-section { margin-bottom: 18px; }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .form-row > * { flex: 1; min-width: 0; }

        .input-with-icons {
            position: relative;
            display: flex;
            gap: 10px;
        }
        .input-with-icons > input { flex: 1; }
        .icon-btn {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 22px;
        }

        .currency-input {
            display: flex;
            gap: 10px;
        }

        .currency-select {
            width: 90px;
            flex: 0 0 auto;
        }

        .amount-input {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
        }

        .select-wrap {
            position: relative;
        }
        .select-wrap select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 36px;
        }
        .select-wrap::after {
            content: '⌄';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-65%);
            color: var(--text-secondary);
            pointer-events: none;
            font-size: 18px;
        }

        /* Primary button */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #fff;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.1s;
        }
        .btn-primary:active { background: var(--primary-hover); }
        .btn-primary:disabled {
            background: var(--bg-elev-2);
            color: var(--text-tertiary);
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: var(--bg-elev);
            color: var(--text);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid var(--border);
        }

        .btn-danger {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--danger);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid var(--danger);
        }

        /* Split section */
        .split-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .split-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid var(--border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            flex-shrink: 0;
            transition: all 0.1s;
        }

        .checkbox.checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .split-mode {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            padding: 6px 4px;
        }

        .split-list {
            background: var(--bg-elev);
            border-radius: 14px;
            overflow: hidden;
        }

        .split-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }
        .split-row:last-child { border-bottom: none; }

        .split-name {
            flex: 1;
            font-weight: 500;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .split-amount {
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .split-amount-input {
            width: 110px;
            text-align: right;
            padding: 8px 12px;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
        }

        /* Balance summary */
        .balance-card {
            background: var(--bg-elev);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
        }

        .balance-title {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .balance-headline {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .balance-detail {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .balance-list {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .balance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--bg-elev-2);
            border-radius: 10px;
            font-size: 14px;
        }
        .balance-row .name { color: var(--text); font-weight: 500; }
        .balance-row .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
        .balance-row .amt.pos { color: var(--success); }
        .balance-row .amt.neg { color: var(--danger); }

        /* Expense list */
        .section-title {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 18px 4px 10px;
            font-weight: 600;
        }

        .expense-group {
            background: var(--bg-elev);
            border-radius: 16px;
            margin-bottom: 14px;
            overflow: hidden;
        }

        .expense-group-date {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 10px 16px;
            background: var(--bg-elev-2);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .expense-row {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .expense-row:last-child { border-bottom: none; }
        .expense-row:active { background: var(--bg-elev-2); }

        .expense-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-elev-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .expense-icon.income { background: rgba(52,199,89,0.15); }
        .expense-icon.transfer { background: rgba(255,149,0,0.15); }

        .expense-info {
            flex: 1;
            min-width: 0;
        }

        .expense-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .expense-meta {
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .expense-amount {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-size: 15px;
        }

        .expense-amount.income { color: var(--success); }
        .expense-amount.transfer { color: var(--warning); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .emoji {
            font-size: 56px;
            margin-bottom: 12px;
        }
        .empty-state .title {
            font-weight: 600;
            color: var(--text);
            font-size: 17px;
            margin-bottom: 6px;
        }

        /* Sync status pill */
        .sync-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--bg-elev-2);
            border-radius: 999px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .sync-pill .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-tertiary);
        }
        .sync-pill.online .dot { background: var(--success); }
        .sync-pill.syncing .dot { background: var(--warning); }
        .sync-pill.offline .dot { background: var(--danger); }

        /* Participants chips */
        .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 14px;
            color: var(--text);
        }

        .chip button {
            color: var(--text-secondary);
            font-size: 18px;
            line-height: 1;
            padding: 0 0 0 4px;
        }

        .chip-add-input {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .chip-add-input input { flex: 1; }
        .chip-add-input button {
            padding: 0 18px;
            background: var(--primary);
            color: #fff;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: calc(var(--safe-bottom) + 24px);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-elev-2);
            color: var(--text);
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.25s;
            z-index: 1000;
            pointer-events: none;
            max-width: 80%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Sheet (modal) */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .sheet-backdrop.show { opacity: 1; }

        .sheet {
            width: 100%;
            max-width: 540px;
            background: var(--bg);
            border-radius: 20px 20px 0 0;
            padding: 8px 20px calc(var(--safe-bottom) + 24px);
            transform: translateY(100%);
            transition: transform 0.25s;
            max-height: 85vh;
            overflow-y: auto;
        }
        .sheet-backdrop.show .sheet { transform: translateY(0); }

        .sheet-handle {
            width: 40px;
            height: 5px;
            background: var(--border);
            border-radius: 999px;
            margin: 8px auto 16px;
        }

        .sheet-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
        }

        /* Emoji picker grid */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .emoji-grid button {
            font-size: 24px;
            padding: 8px;
            border-radius: 8px;
            background: var(--bg-elev);
        }
        .emoji-grid button.selected {
            background: var(--primary-soft);
            outline: 2px solid var(--primary);
        }

        /* Share */
        .share-link-box {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            font-family: ui-monospace, 'SF Mono', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            word-break: break-all;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .room-pill {
            display: inline-block;
            padding: 6px 12px;
            background: var(--primary-soft);
            color: var(--primary);
            border-radius: 8px;
            font-family: ui-monospace, monospace;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 1px;
        }

        /* Settle list inline */
        .settle-mini {
            background: rgba(52,199,89,0.1);
            border: 1px solid rgba(52,199,89,0.3);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--success);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .settle-mini button {
            color: var(--success);
            font-size: 16px;
            opacity: 0.7;
            padding: 0 4px;
        }

        a { color: var(--primary); text-decoration: none; }

        /* Hide spinner arrows on number input - already done above */

        /* Long-press feedback */
        .pressable:active { opacity: 0.6; }

        /* Error message */
        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 6px;
        }

        /* Helper text */
        .helper {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 6px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    const STORAGE_KEYS = {
        cache: 'warikan_v3_cache',          // cached copy of the shared data (offline safety)
        me: 'warikan_v3_me',                // device-local: which participant this device is
        legacyMigrated: 'warikan_v3_legacy_migrated',
    };

    // One fixed shared space. Everyone who opens the page syncs here.
    // No room IDs, no join step — the URL itself IS the shared notebook.
    const SHARED_PATH = 'shared/v2';

    // Old per-room sync data to auto-restore once into the shared node.
    const LEGACY_ROOMS = ['NJ81Z5'];

    // ------------------------------------------------------------------
    // State
    // ------------------------------------------------------------------
    const state = {
        view: 'home',           // 'home' | 'tricount'
        sheet: null,            // sheet name when modal open
        sheetData: null,        // arbitrary data for sheet
        tricounts: [],          // the shared array of full tricount objects
        currentId: null,        // id of the open tricount
        currentData: null,      // reference to the open tricount object
        me: {},                 // device-local map { tricountId: participantId }
        syncStatus: 'idle',     // 'idle' | 'online' | 'syncing' | 'offline' | 'error'
        sharedRef: null,        // the single global Firebase ref
        suppressSync: false,    // prevent write-loop on remote update
    };

    // ------------------------------------------------------------------
    // Local storage (cache so data is never lost, even offline)
    // ------------------------------------------------------------------
    function loadCache() {
        try {
            const raw = localStorage.getItem(STORAGE_KEYS.cache);
            if (!raw) return [];
            const v = JSON.parse(raw);
            if (v && Array.isArray(v.tricounts)) return v.tricounts;
            if (Array.isArray(v)) return v;
            return [];
        } catch { return []; }
    }
    function saveCache() {
        try {
            localStorage.setItem(STORAGE_KEYS.cache, JSON.stringify({
                tricounts: state.tricounts, updatedAt: Date.now(),
            }));
        } catch (e) { console.error('cache save failed', e); }
    }
    function loadMe() {
        try {
            const raw = localStorage.getItem(STORAGE_KEYS.me);
            return raw ? JSON.parse(raw) : {};
        } catch { return {}; }
    }
    function saveMe() {
        try { localStorage.setItem(STORAGE_KEYS.me, JSON.stringify(state.me)); } catch {}
    }

    // Which participant is "me" on THIS device for a given tricount.
    function getMyId(tc) {
        if (!tc) return null;
        const saved = state.me[tc.id];
        if (saved && (tc.participants || []).some(p => p.id === saved)) return saved;
        return (tc.participants && tc.participants[0]) ? tc.participants[0].id : null;
    }
    function setMyId(tcId, pid) {
        state.me[tcId] = pid;
        saveMe();
    }
    function currentTC() {
        return state.tricounts.find(t => t.id === state.currentId) || null;
    }

    // ------------------------------------------------------------------
    // Utils
    // ------------------------------------------------------------------
    function uid(prefix) {
        return (prefix || '') + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    function formatMoney(amount, currency) {
        const c = CURRENCIES[currency] || CURRENCIES.JPY;
        const v = Math.abs(amount).toLocaleString(undefined, {
            minimumFractionDigits: c.decimals,
            maximumFractionDigits: c.decimals,
        });
        return (amount < 0 ? '-' : '') + c.symbol + v;
    }

    function todayISO() {
        const d = new Date();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${d.getFullYear()}-${m}-${day}`;
    }

    function formatDateLong(iso) {
        if (!iso) return '';
        const d = new Date(iso + 'T00:00:00');
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    }

    function formatDateShort(iso) {
        if (!iso) return '';
        const d = new Date(iso + 'T00:00:00');
        return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s == null ? '' : String(s);
        return div.innerHTML;
    }

    function escapeAttr(s) {
        return escapeHtml(s).replace(/"/g, '&quot;');
    }

    function showToast(msg, ms = 2200) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('show'), ms);
    }

    function roundForCurrency(amount, currency) {
        const c = CURRENCIES[currency] || CURRENCIES.JPY;
        const factor = Math.pow(10, c.decimals);
        return Math.round(amount * factor) / factor;
    }

    function distributeEqually(total, count, currency) {
        if (count <= 0) return [];
        const c = CURRENCIES[currency] || CURRENCIES.JPY;
        const factor = Math.pow(10, c.decimals);
        const cents = Math.round(total * factor);
        const base = Math.floor(cents / count);
        const remainder = cents - base * count;
        return Array.from({ length: count }, (_, i) =>
            (base + (i < remainder ? 1 : 0)) / factor
        );
    }

    // ------------------------------------------------------------------
    // Firebase sync layer  (one shared node, always-on, no rooms)
    // ------------------------------------------------------------------
    function applyRemote(remote) {
        const list = remote && Array.isArray(remote.tricounts) ? remote.tricounts : [];
        state.suppressSync = true;
        state.tricounts = list;
        if (state.currentId) {
            state.currentData = currentTC();
            if (!state.currentData) { state.currentId = null; state.view = 'home'; }
        }
        state.suppressSync = false;
        saveCache();
    }

    function subscribeShared() {
        if (state.sharedRef) return;
        const ref = db.ref(SHARED_PATH);
        state.sharedRef = ref;
        if (state.syncStatus === 'idle') state.syncStatus = 'syncing';
        ref.on('value', (snap) => {
            const v = snap.val();
            if (v) applyRemote(v);
            state.syncStatus = 'online';
            render();
        }, (err) => {
            console.error('Firebase read error', err);
            state.syncStatus = 'offline';
            render();
        });
    }

    function resubscribeShared() {
        if (state.sharedRef) { state.sharedRef.off(); state.sharedRef = null; }
        subscribeShared();
    }

    // Persist the whole shared array to Firebase + local cache.
    function pushShared() {
        if (state.suppressSync) return;
        saveCache();
        state.syncStatus = 'syncing';
        render();
        db.ref(SHARED_PATH).set({ tricounts: state.tricounts, updatedAt: Date.now() })
            .then(() => { state.syncStatus = 'online'; render(); })
            .catch((e) => {
                console.error('Save error', e);
                state.syncStatus = 'offline';
                showToast('オフライン保存中（再接続したら自動同期）');
                render();
            });
    }

    // ------------------------------------------------------------------
    // Tricount data ops
    // ------------------------------------------------------------------
    function createTricount({ name, emoji, description, currency, participants, myId }) {
        const tc = {
            id: uid('tc_'),
            name: name || 'New tricount',
            emoji: emoji || '\ud83d\udcb0',
            description: description || '',
            currency: currency || 'JPY',
            participants: participants,
            expenses: [],
            settlements: [],
            createdAt: Date.now(),
            updatedAt: Date.now(),
        };
        state.tricounts = [tc, ...state.tricounts];
        if (myId) setMyId(tc.id, myId);
        pushShared();
        return tc;
    }

    function openTricount(id) {
        const tc = state.tricounts.find(t => t.id === id);
        if (!tc) return;
        state.currentId = id;
        state.currentData = tc;
        state.view = 'tricount';
        render();
    }

    function exitTricount() {
        state.currentId = null;
        state.currentData = null;
        state.view = 'home';
        render();
    }

    function touch(tc) {
        if (tc) tc.updatedAt = Date.now();
    }

    function addParticipant(name) {
        const tc = currentTC();
        if (!tc) return null;
        const p = { id: uid('p_'), name: name.trim() };
        tc.participants = [...(tc.participants || []), p];
        touch(tc);
        pushShared();
        return p;
    }

    function removeParticipant(participantId) {
        const tc = currentTC();
        if (!tc) return;
        const inUse = (tc.expenses || []).some(e =>
            e.paidBy === participantId || (e.splits || []).some(s => s.participantId === participantId)
        ) || (tc.settlements || []).some(s => s.from === participantId || s.to === participantId);
        if (inUse) {
            showToast('支払い履歴に使われているので削除できません');
            return;
        }
        tc.participants = (tc.participants || []).filter(p => p.id !== participantId);
        touch(tc);
        pushShared();
    }

    function renameParticipant(participantId, newName) {
        const tc = currentTC();
        if (!tc) return;
        const p = (tc.participants || []).find(p => p.id === participantId);
        if (p) { p.name = newName.trim(); touch(tc); pushShared(); }
    }

    function addExpense(expense) {
        const tc = currentTC();
        if (!tc) return;
        tc.expenses = [...(tc.expenses || []), expense];
        touch(tc);
        pushShared();
    }

    function updateExpense(updated) {
        const tc = currentTC();
        if (!tc) return;
        tc.expenses = (tc.expenses || []).map(e => e.id === updated.id ? updated : e);
        touch(tc);
        pushShared();
    }

    function deleteExpense(id) {
        const tc = currentTC();
        if (!tc) return;
        tc.expenses = (tc.expenses || []).filter(e => e.id !== id);
        touch(tc);
        pushShared();
    }

    function addSettlement(settlement) {
        const tc = currentTC();
        if (!tc) return;
        tc.settlements = [...(tc.settlements || []), settlement];
        touch(tc);
        pushShared();
    }

    function deleteSettlement(id) {
        const tc = currentTC();
        if (!tc) return;
        tc.settlements = (tc.settlements || []).filter(s => s.id !== id);
        touch(tc);
        pushShared();
    }

    function deleteTricount(id) {
        state.tricounts = state.tricounts.filter(t => t.id !== id);
        if (state.me[id]) { delete state.me[id]; saveMe(); }
        if (state.currentId === id) {
            state.currentId = null;
            state.currentData = null;
            state.view = 'home';
        }
        pushShared();
    }

    // ------------------------------------------------------------------
    // Balance calculation
    // ------------------------------------------------------------------
    function computeBalances(data) {
        const balances = {};
        (data.participants || []).forEach(p => { balances[p.id] = 0; });

        (data.expenses || []).forEach(e => {
            const sign = e.type === 'income' ? -1 : 1;
            // Money paid out by paidBy
            if (e.type === 'transfer') {
                // transfer: paidBy -> recipient (single split). paidBy gains, recipient loses.
                balances[e.paidBy] = (balances[e.paidBy] || 0) + e.amount;
                (e.splits || []).forEach(s => {
                    balances[s.participantId] = (balances[s.participantId] || 0) - s.amount;
                });
            } else {
                balances[e.paidBy] = (balances[e.paidBy] || 0) + sign * e.amount;
                (e.splits || []).forEach(s => {
                    balances[s.participantId] = (balances[s.participantId] || 0) - sign * s.amount;
                });
            }
        });

        (data.settlements || []).forEach(s => {
            balances[s.from] = (balances[s.from] || 0) + s.amount;
            balances[s.to] = (balances[s.to] || 0) - s.amount;
        });

        // Round
        Object.keys(balances).forEach(k => {
            balances[k] = roundForCurrency(balances[k], data.currency);
        });
        return balances;
    }

    // Greedy settlement plan (who pays whom how much)
    function settlementPlan(data) {
        const balances = computeBalances(data);
        const debtors = [];
        const creditors = [];
        Object.keys(balances).forEach(id => {
            const v = balances[id];
            if (v < -0.01) debtors.push({ id, v: -v });
            else if (v > 0.01) creditors.push({ id, v });
        });
        debtors.sort((a, b) => b.v - a.v);
        creditors.sort((a, b) => b.v - a.v);
        const transfers = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
            const d = debtors[i], c = creditors[j];
            const amt = roundForCurrency(Math.min(d.v, c.v), data.currency);
            transfers.push({ from: d.id, to: c.id, amount: amt });
            d.v -= amt;
            c.v -= amt;
            if (d.v < 0.01) i++;
            if (c.v < 0.01) j++;
        }
        return { balances, transfers };
    }

    function nameOf(data, participantId) {
        const p = (data.participants || []).find(p => p.id === participantId);
        return p ? p.name : '?';
    }

    // ------------------------------------------------------------------
    // Legacy import + data recovery
    // ------------------------------------------------------------------
    // Build a tricount object from the original app's payments/settlements.
    function buildLegacyTricount(payments, settlements, opts) {
        opts = opts || {};
        const p1 = uid('p_');   // "you" in the old schema
        const p2 = uid('p_');   // "partner" in the old schema
        return {
            id: uid('tc_'),
            migratedFrom: opts.migratedFrom || null,
            recoveredFrom: opts.recoveredFrom || null,
            name: opts.name || '\u305f\u3064\u3084 \u2661 \u30ec\u30d9\u30c3\u30ab',
            emoji: opts.emoji || '\ud83d\udc95',
            description: opts.description || '\u65e7\u30a2\u30d7\u30ea\u304b\u3089\u5fa9\u5143',
            currency: 'JPY',
            participants: [
                { id: p1, name: '\u305f\u3064\u3084' },
                { id: p2, name: '\u30ec\u30d9\u30c3\u30ab' },
            ],
            expenses: (payments || []).map(p => ({
                id: uid('e_'),
                type: 'expense',
                title: p.description || '\u652f\u6255\u3044',
                amount: Number(p.total) || 0,
                paidBy: p.payer === 'you' ? p1 : p2,
                date: p.date || todayISO(),
                splits: [
                    { participantId: p1, amount: Number(p.youAmount) || 0 },
                    { participantId: p2, amount: Number(p.partnerAmount) || 0 },
                ],
                createdAt: Number(p.id) || Date.now(),
            })),
            settlements: (settlements || []).map(s => ({
                id: uid('s_'),
                date: s.date || todayISO(),
                amount: Number(s.amount) || 0,
                from: s.payer === 'you' ? p1 : p2,
                to: s.receiver === 'you' ? p1 : p2,
            })),
            createdAt: Date.now(),
            updatedAt: Date.now(),
            _myId: p1,
        };
    }

    // Add a tricount to the shared node, guarded so it can't duplicate.
    function addTricountGuarded(tc, dedupeKey, dedupeVal) {
        return db.ref(SHARED_PATH).transaction((curr) => {
            curr = curr || { tricounts: [] };
            curr.tricounts = curr.tricounts || [];
            if (dedupeKey && curr.tricounts.some(t => t && t[dedupeKey] === dedupeVal)) return curr;
            const clean = { ...tc };
            delete clean._myId;
            curr.tricounts = [clean, ...curr.tricounts];
            curr.updatedAt = Date.now();
            return curr;
        }).then((res) => {
            if (tc._myId) setMyId(tc.id, tc._myId);
            return res;
        });
    }

    function migrateLegacyIfNeeded() {
        if (localStorage.getItem(STORAGE_KEYS.legacyMigrated)) return;
        const oldP = localStorage.getItem('warikan_payments');
        const oldS = localStorage.getItem('warikan_settlements');
        if (!oldP && !oldS) { localStorage.setItem(STORAGE_KEYS.legacyMigrated, '1'); return; }
        let payments = [], settlements = [];
        try { payments = JSON.parse(oldP || '[]'); settlements = JSON.parse(oldS || '[]'); } catch {}
        if (!payments.length && !settlements.length) { localStorage.setItem(STORAGE_KEYS.legacyMigrated, '1'); return; }
        const tc = buildLegacyTricount(payments, settlements, {
            migratedFrom: 'v1', description: '\u65e7\u30a2\u30d7\u30ea\uff08\u3053\u306e\u7aef\u672b\uff09\u304b\u3089\u5f15\u304d\u7d99\u304e',
        });
        addTricountGuarded(tc, 'migratedFrom', 'v1').then(() => {
            localStorage.setItem(STORAGE_KEYS.legacyMigrated, '1');
            showToast('\u3053\u306e\u7aef\u672b\u306e\u65e7\u30c7\u30fc\u30bf\u3092\u5fa9\u5143\u3057\u305f\u3088');
        }).catch((e) => console.error('Legacy migration failed', e));
    }

    // Pull old Firebase room data (rooms/<id>) back into the shared node.
    function parseRoomId(input) {
        if (!input) return '';
        let s = String(input).trim();
        const m = s.match(/[?&]room=([^&\s]+)/i);
        if (m) return m[1].toUpperCase();
        s = s.split(/[?#/\s]/).filter(Boolean).pop() || s;
        return s.toUpperCase();
    }

    async function recoverFromRoom(input, opts) {
        opts = opts || {};
        const roomId = parseRoomId(input);
        if (!roomId) { showToast('\u30ea\u30f3\u30af\u304bID\u3092\u5165\u308c\u3066\u306d'); return false; }
        // Already recovered this room?
        if (state.tricounts.some(t => t && t.recoveredFrom === roomId)) {
            if (!opts.silent) showToast('\u3053\u306e\u30c7\u30fc\u30bf\u306f\u3082\u3046\u5fa9\u5143\u6e08\u307f\u3060\u3088');
            return true;
        }
        try {
            if (!opts.silent) { state.syncStatus = 'syncing'; render(); }
            const ref = db.ref('rooms/' + roomId);
            // Try get(); some setups reject get() but allow once('value').
            let snap;
            try {
                snap = await ref.get();
            } catch (e1) {
                console.warn('get() failed, retrying once(value)', e1);
                snap = await ref.once('value');
            }
            if (!snap || !snap.exists()) {
                if (!opts.silent) showToast('rooms/' + roomId + ' \u306b\u30c7\u30fc\u30bf\u304c\u898b\u3064\u304b\u3089\u306a\u3044');
                state.syncStatus = 'online'; render();
                return false;
            }
            const v = snap.val() || {};
            const payments = Array.isArray(v.payments) ? v.payments
                : (v.payments ? Object.values(v.payments) : []);
            const settlements = Array.isArray(v.settlements) ? v.settlements
                : (v.settlements ? Object.values(v.settlements) : []);
            if (!payments.length && !settlements.length) {
                if (!opts.silent) showToast('\u305d\u306e\u90e8\u5c4b\u306f\u7a7a\u3060\u3063\u305f\uff08' + roomId + '\uff09');
                state.syncStatus = 'online'; render();
                return false;
            }
            const tc = buildLegacyTricount(payments, settlements, {
                recoveredFrom: roomId,
                name: '\u305f\u3064\u3084 \u2661 \u30ec\u30d9\u30c3\u30ab',
                description: '\u65e7\u540c\u671f\u30c7\u30fc\u30bf\u3092\u5fa9\u5143 (' + roomId + ')',
            });
            await addTricountGuarded(tc, 'recoveredFrom', roomId);
            showToast('\u540c\u671f\u30c7\u30fc\u30bf\u3092\u5fa9\u5143\u3057\u305f\uff01(' + payments.length + '\u4ef6)');
            return true;
        } catch (e) {
            console.error('recoverFromRoom failed', e);
            const code = (e && (e.code || e.message)) ? String(e.code || e.message) : 'unknown';
            const denied = /permission|denied/i.test(code);
            if (!opts.silent) {
                showToast(denied
                    ? 'Firebase\u306e\u6a29\u9650\u62d2\u5426(' + code + ')\u3002DB\u30eb\u30fc\u30eb\u306e\u78ba\u8a8d\u304c\u5fc5\u8981'
                    : '\u5fa9\u5143\u5931\u6557: ' + code, 6000);
            }
            state.syncStatus = 'offline'; render();
            return false;
        }
    }

    // On launch, if the URL still carries an old ?room=, auto-recover it.
    function autoRecoverFromUrl() {
        const m = window.location.search.match(/[?&]room=([^&]+)/i);
        if (m && m[1]) recoverFromRoom(m[1], { silent: false });
    }

    // ------------------------------------------------------------------
    // Rendering
    // ------------------------------------------------------------------
    const app = document.getElementById('app');

    function render() {
        let html = '';
        if (state.view === 'home') {
            html = renderHome();
        } else if (state.view === 'tricount' && state.currentData) {
            html = renderTricount();
        } else {
            html = renderHome();
        }
        if (state.sheet) {
            html += renderSheet();
        }
        app.innerHTML = html;
        bindEvents();
    }

    // ---- Home ----
    function renderHome() {
        const items = state.tricounts.length > 0
            ? state.tricounts.map(t => {
                let preview = t.description || ' ';
                let previewColor = '';
                {
                    const cur = t.currency || 'JPY';
                    const balances = computeBalances(t);
                    const bal = balances[getMyId(t)] || 0;
                    const hasItems = (t.expenses || []).length > 0 || (t.settlements || []).length > 0;
                    if (!hasItems) {
                        preview = t.description || 'まだ支払いなし';
                    } else if (Math.abs(bal) < 0.01) {
                        preview = '✓ 精算済み';
                        previewColor = 'color: var(--success);';
                    } else if (bal > 0) {
                        preview = `+${formatMoney(bal, cur)} もらえる`;
                        previewColor = 'color: var(--success);';
                    } else {
                        preview = `${formatMoney(bal, cur)} 払う`;
                        previewColor = 'color: var(--danger);';
                    }
                }
                return `
                <div class="tricount-card pressable" data-action="open-tricount" data-id="${escapeAttr(t.id)}">
                    <div class="tricount-emoji">${escapeHtml(t.emoji || '💰')}</div>
                    <div class="tricount-info">
                        <div class="tricount-name">${escapeHtml(t.name)}</div>
                        <div class="tricount-desc" style="${previewColor}">${escapeHtml(preview)}</div>
                    </div>
                    <div class="tricount-arrow">›</div>
                </div>
                `;
            }).join('')
            : `<div class="empty-state">
                <div class="emoji">💰</div>
                <div class="title">トリカウントはまだないよ</div>
                <div>下の＋から最初のグループを作ろう</div>
              </div>`;

        const syncCls = state.syncStatus === 'online' ? 'online'
            : state.syncStatus === 'syncing' ? 'syncing'
            : state.syncStatus === 'offline' ? 'offline' : '';
        const syncText = state.syncStatus === 'online' ? '常時同期中'
            : state.syncStatus === 'syncing' ? '接続中…'
            : state.syncStatus === 'offline' ? 'オフライン（再接続待ち）'
            : '同期準備中';

        return `
            <div class="screen">
                <div class="brand">

    // ---- Tricount detail ----
    function renderTricount() {
        const data = state.currentData;
        const myId = getMyId(data);
        const { balances, transfers } = settlementPlan(data);

        const myBalance = myId ? (balances[myId] || 0) : 0;
        let headline, detail;
        if (Math.abs(myBalance) < 0.01) {
            headline = '精算済みです';
            detail = (data.expenses || []).length === 0 ? 'まだ支払いはないよ' : 'いまの差額はゼロ';
        } else if (myBalance > 0) {
            headline = `+${formatMoney(myBalance, data.currency)}`;
            detail = 'みんなからもらえる金額';
        } else {
            headline = `-${formatMoney(-myBalance, data.currency)}`;
            detail = 'あなたが払う金額';
        }

        // Suggested transfers (settle up plan)
        const transferRows = transfers.map(t => `
            <div class="balance-row">
                <span class="name">${escapeHtml(nameOf(data, t.from))} → ${escapeHtml(nameOf(data, t.to))}</span>
                <span class="amt">${formatMoney(t.amount, data.currency)}</span>
            </div>
        `).join('');

        // Per-participant balance breakdown
        const balanceRows = (data.participants || []).map(p => {
            const v = balances[p.id] || 0;
            const sign = v > 0.01 ? 'pos' : (v < -0.01 ? 'neg' : '');
            const prefix = v > 0.01 ? '+' : '';
            return `
                <div class="balance-row">
                    <span class="name">${escapeHtml(p.name)}${p.id === myId ? ' (me)' : ''}</span>
                    <span class="amt ${sign}">${Math.abs(v) < 0.01 ? formatMoney(0, data.currency) : prefix + formatMoney(v, data.currency)}</span>
                </div>
            `;
        }).join('');

        // Group expenses by date
        const allItems = [
            ...(data.expenses || []).map(e => ({ kind: 'expense', date: e.date, e })),
            ...(data.settlements || []).map(s => ({ kind: 'settle', date: s.date, s })),
        ].sort((a, b) => {
            if (a.date !== b.date) return a.date < b.date ? 1 : -1;
            const ta = a.kind === 'expense' ? (a.e.createdAt || 0) : 0;
            const tb = b.kind === 'expense' ? (b.e.createdAt || 0) : 0;
            return tb - ta;
        });

        const groupsByDate = {};
        allItems.forEach(it => {
            (groupsByDate[it.date] = groupsByDate[it.date] || []).push(it);
        });
        const dateKeys = Object.keys(groupsByDate).sort((a, b) => a < b ? 1 : -1);

        const expensesHtml = dateKeys.length === 0
            ? `<div class="empty-state">
                <div class="emoji">🧾</div>
                <div class="title">支払いがまだないよ</div>
                <div>下の＋から最初の支払いを記録しよう</div>
              </div>`
            : dateKeys.map(dk => `
                <div class="expense-group">
                    <div class="expense-group-date">${escapeHtml(formatDateLong(dk))}</div>
                    ${groupsByDate[dk].map(it => it.kind === 'expense' ? renderExpenseRow(data, it.e) : renderSettleRow(data, it.s)).join('')}
                </div>
            `).join('');

        const syncCls = state.syncStatus === 'online' ? 'online'
            : state.syncStatus === 'syncing' ? 'syncing'
            : state.syncStatus === 'offline' || state.syncStatus === 'error' ? 'offline' : '';
        const syncText = state.syncStatus === 'online' ? '同期中'
            : state.syncStatus === 'syncing' ? '同期中…'
            : state.syncStatus === 'offline' ? 'オフライン'
            : state.syncStatus === 'error' ? 'エラー' : '保存済み';

        return `
            <div class="screen">
                <div class="topbar">
                    <button class="topbar-back" data-action="back-home" aria-label="Back">‹</button>
                    <div class="topbar-title">${escapeHtml(data.emoji || '')} ${escapeHtml(data.name)}</div>
                    <button class="topbar-action icon" data-action="open-settings" aria-label="Settings">⚙</button>
                    <button class="topbar-action icon" data-action="open-share" aria-label="Share">↗</button>
                </div>
                <div class="scroll">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span class="sync-pill ${syncCls}"><span class="dot"></span>${escapeHtml(syncText)}</span>
                        <span style="font-size:12px; color: var(--text-secondary);">${(data.participants || []).length}人 · ${(data.expenses || []).length}件</span>
                    </div>
                    <div class="balance-card">
                        <div class="balance-title">あなたの残高</div>
                        <div class="balance-headline" style="color:${myBalance > 0.01 ? 'var(--success)' : myBalance < -0.01 ? 'var(--danger)' : 'var(--text)'}">${escapeHtml(headline)}</div>
                        <div class="balance-detail">${escapeHtml(detail)}</div>
                        ${balanceRows ? `<div class="balance-list">${balanceRows}</div>` : ''}
                        ${transferRows ? `
                            <div style="margin-top:14px;">
                                <div class="balance-title" style="margin-bottom:6px;">いちばんシンプルな精算</div>
                                <div class="balance-list">${transferRows}</div>
                                <button class="btn-secondary" style="margin-top:10px;" data-action="quick-settle">この内容で精算を記録</button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="section-title">履歴</div>
                    ${expensesHtml}
                </div>
                <div class="fab-wrap">
                    <button class="fab" data-action="add-expense" aria-label="Add expense">+</button>
                    <div class="fab-label">Add expense</div>
                </div>
            </div>
        `;
    }

    function renderExpenseRow(data, e) {
        const isIncome = e.type === 'income';
        const isTransfer = e.type === 'transfer';
        const icon = isIncome ? '⇣' : isTransfer ? '⇄' : '🧾';
        const cls = isIncome ? 'income' : isTransfer ? 'transfer' : '';
        let meta;
        if (isTransfer) {
            const recipient = (e.splits || [])[0];
            meta = `${nameOf(data, e.paidBy)} → ${recipient ? nameOf(data, recipient.participantId) : '?'}`;
        } else {
            const involved = (e.splits || []).length;
            meta = `${nameOf(data, e.paidBy)}が払い · ${involved}人で割り勘`;
        }
        return `
            <div class="expense-row pressable" data-action="open-expense" data-id="${escapeAttr(e.id)}">
                <div class="expense-icon ${cls}">${icon}</div>
                <div class="expense-info">
                    <div class="expense-title">${escapeHtml(e.title || '無題')}</div>
                    <div class="expense-meta">${escapeHtml(meta)}</div>
                </div>
                <div class="expense-amount ${cls}">${isIncome ? '+' : ''}${formatMoney(e.amount, data.currency)}</div>
            </div>
        `;
    }

    function renderSettleRow(data, s) {
        return `
            <div class="expense-row pressable" data-action="open-settle" data-id="${escapeAttr(s.id)}">
                <div class="expense-icon transfer">💸</div>
                <div class="expense-info">
                    <div class="expense-title">精算</div>
                    <div class="expense-meta">${escapeHtml(nameOf(data, s.from))} → ${escapeHtml(nameOf(data, s.to))}</div>
                </div>
                <div class="expense-amount transfer">${formatMoney(s.amount, data.currency)}</div>
            </div>
        `;
    }

    // ---- Sheets ----
    function renderSheet() {
        let inner = '';
        switch (state.sheet) {
            case 'newTricount': inner = sheetNewTricount(); break;
            case 'addExpense': inner = sheetEditExpense(null); break;
            case 'editExpense': inner = sheetEditExpense(state.sheetData.id); break;
            case 'editSettle': inner = sheetEditSettle(state.sheetData.id); break;
            case 'share': inner = sheetShare(); break;
            case 'settings': inner = sheetSettings(); break;
            case 'help': inner = sheetHelp(); break;
            case 'recover': inner = sheetRecover(); break;
            case 'addSettle': inner = sheetAddSettle(); break;

        return `
            <div class="sheet-backdrop show" data-action="close-sheet">
                <div class="sheet" data-stop>
                    <div class="sheet-handle"></div>
                    ${inner}
                </div>
            </div>

    }

    function sheetEditExpense(existingId) {
        const data = state.currentData;
        const myId = getMyId(data);

        let draft = state.sheetData;
        if (existingId && (!draft || draft.id !== existingId)) {
            const existing = (data.expenses || []).find(e => e.id === existingId);
            if (existing) {
                // Deep clone with split mode detection
                const equalSplits = distributeEqually(existing.amount, existing.splits.length, data.currency);
                const isEqual = existing.splits.every((s, i) => Math.abs(s.amount - equalSplits[i]) < 0.01);
                draft = {
                    id: existing.id,
                    type: existing.type,
                    title: existing.title,
                    amount: existing.amount,
                    paidBy: existing.paidBy,
                    date: existing.date,
                    splits: existing.splits.map(s => ({ ...s, included: true })),
                    splitMode: isEqual ? 'equal' : 'custom',
                    createdAt: existing.createdAt,
                };
                // Add unincluded participants
                data.participants.forEach(p => {
                    if (!draft.splits.find(s => s.participantId === p.id)) {
                        draft.splits.push({ participantId: p.id, amount: 0, included: false });
                    }
                });
                state.sheetData = draft;
            }
        } else if (!draft) {
            draft = {
                id: null,
                type: 'expense',
                title: '',
                amount: 0,
                paidBy: myId,
                date: todayISO(),
                splits: data.participants.map(p => ({ participantId: p.id, amount: 0, included: true })),
                splitMode: 'equal',
                createdAt: Date.now(),
            };
            state.sheetData = draft;
        }

        // Recalc equal split amounts
        if (draft.splitMode === 'equal') {
            const included = draft.splits.filter(s => s.included);
            const eq = distributeEqually(draft.amount, included.length, data.currency);
            included.forEach((s, i) => { s.amount = eq[i] || 0; });
            draft.splits.filter(s => !s.included).forEach(s => { s.amount = 0; });
        }

        const tabs = ['expense','income','transfer'].map(t => `
            <div class="tab ${draft.type === t ? 'active' : ''}" data-action="set-type" data-type="${t}">
                ${t === 'expense' ? '支出' : t === 'income' ? '収入' : '送金'}
            </div>
        `).join('');

        const currencyOpts = Object.keys(CURRENCIES).map(k =>
            `<option value="${k}" ${k === data.currency ? 'selected' : ''}>${escapeHtml(CURRENCIES[k].symbol)}</option>`
        ).join('');

        const paidByOpts = data.participants.map(p =>
            `<option value="${escapeAttr(p.id)}" ${p.id === draft.paidBy ? 'selected' : ''}>${escapeHtml(p.name)}${p.id === myId ? ' (me)' : ''}</option>`
        ).join('');

        let splitSection = '';
        if (draft.type === 'transfer') {
            // Transfer: pick recipient (single)
            const recipient = (draft.splits.find(s => s.included) || { participantId: null }).participantId;
            const recipientOpts = data.participants
                .filter(p => p.id !== draft.paidBy)
                .map(p => `<option value="${escapeAttr(p.id)}" ${p.id === recipient ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('');
            splitSection = `
                <div class="form-section">
                    <label class="form-label">受け取る人</label>
                    <div class="select-wrap">
                        <select data-field="transferTo">${recipientOpts || '<option>(他の人を追加してね)</option>'}</select>
                    </div>
                </div>
            `;
        } else {
            const splitRows = draft.splits.map(s => {
                const p = data.participants.find(pp => pp.id === s.participantId);
                if (!p) return '';
                return `
                    <div class="split-row">
                        <button class="checkbox ${s.included ? 'checked' : ''}" data-action="toggle-split" data-id="${escapeAttr(s.participantId)}">${s.included ? '✓' : ''}</button>
                        <div class="split-name">${escapeHtml(p.name)}</div>
                        ${draft.splitMode === 'custom'
                            ? `<input class="split-amount-input" type="number" inputmode="decimal" step="0.01" min="0" data-split-amount="${escapeAttr(s.participantId)}" value="${s.included ? s.amount : 0}" ${s.included ? '' : 'disabled'}>`
                            : `<div class="split-amount">${formatMoney(s.amount, data.currency)}</div>`
                        }
                    </div>
                `;
            }).join('');
            const sumIncluded = draft.splits.filter(s => s.included).reduce((acc, s) => acc + Number(s.amount || 0), 0);
            const diff = roundForCurrency(draft.amount - sumIncluded, data.currency);
            const warn = draft.splitMode === 'custom' && Math.abs(diff) > 0.01
                ? `<div class="error-msg">合計が ${formatMoney(diff, data.currency)} ${diff > 0 ? '足りない' : '多い'} よ</div>`
                : '';
            splitSection = `
                <div class="form-section">
                    <div class="split-header">
                        <div class="split-toggle">
                            <span class="form-label" style="margin:0;">割り勘</span>
                        </div>
                        <button class="split-mode" data-action="toggle-split-mode">
                            ${draft.splitMode === 'equal' ? '均等' : '個別指定'} ⌃⌄
                        </button>
                    </div>
                    <div class="split-list">${splitRows}</div>
                    ${warn}
                </div>
            `;
        }

        return `
            <div class="sheet-title">${existingId ? '支払いを編集' : '支払いを追加'}</div>
            <div class="tabs">${tabs}</div>

            <div class="form-section">
                <label class="form-label">タイトル</label>
                <input data-field="title" value="${escapeAttr(draft.title)}" placeholder="例: 食事 / 宿泊" maxlength="60">
            </div>

            <div class="form-section">
                <label class="form-label">金額</label>
                <div class="currency-input">
                    <div class="select-wrap currency-select">
                        <select disabled>${currencyOpts}</select>
                    </div>
                    <input class="amount-input" data-field="amount" type="number" inputmode="decimal" step="${CURRENCIES[data.currency].decimals === 0 ? '1' : '0.01'}" min="0" value="${draft.amount || ''}" placeholder="0">
                </div>
            </div>

            <div class="form-row" style="margin-bottom:18px;">
                <div>
                    <label class="form-label">${draft.type === 'income' ? '受け取った人' : '払った人'}</label>
                    <div class="select-wrap">
                        <select data-field="paidBy">${paidByOpts}</select>
                    </div>
                </div>
                <div>
                    <label class="form-label">日付</label>
                    <input data-field="date" type="date" value="${escapeAttr(draft.date)}">
                </div>
            </div>

            ${splitSection}

            <button class="btn-primary" data-action="confirm-expense">${existingId ? '保存' : '追加'}</button>
            ${existingId ? `<button class="btn-danger" style="margin-top:10px;" data-action="delete-expense" data-id="${escapeAttr(existingId)}">削除</button>` : ''}
        `;
    }

    function sheetAddSettle() {
        const data = state.currentData;
        const draft = state.sheetData = state.sheetData || (() => {
            const plan = settlementPlan(data);
            const t = plan.transfers[0];
            const myId = getMyId(data);
            return {
                from: t ? t.from : (myId || data.participants[0].id),
                to: t ? t.to : (data.participants.find(p => p.id !== (myId || data.participants[0].id)) || data.participants[0]).id,
                amount: t ? t.amount : 0,
                date: todayISO(),
            };
        })();

        const fromOpts = data.participants.map(p =>
            `<option value="${escapeAttr(p.id)}" ${p.id === draft.from ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
        ).join('');
        const toOpts = data.participants.map(p =>
            `<option value="${escapeAttr(p.id)}" ${p.id === draft.to ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
        ).join('');
        return `
            <div class="sheet-title">精算を記録</div>
            <div class="form-row" style="margin-bottom:18px;">
                <div>
                    <label class="form-label">支払う人</label>
                    <div class="select-wrap"><select data-field="settleFrom">${fromOpts}</select></div>
                </div>
                <div>
                    <label class="form-label">受け取る人</label>
                    <div class="select-wrap"><select data-field="settleTo">${toOpts}</select></div>
                </div>
            </div>
            <div class="form-section">
                <label class="form-label">金額</label>
                <input class="amount-input" data-field="settleAmount" type="number" inputmode="decimal" step="${CURRENCIES[data.currency].decimals === 0 ? '1' : '0.01'}" value="${draft.amount}">
            </div>
            <div class="form-section">
                <label class="form-label">日付</label>
                <input data-field="settleDate" type="date" value="${escapeAttr(draft.date)}">
            </div>
            <button class="btn-primary" data-action="confirm-settle">記録する</button>
        `;
    }
